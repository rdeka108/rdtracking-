name: Build FieldTrace APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            echo '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FieldTrace</title></head><body style="font-family:sans-serif;text-align:center;padding:40px"><h1>FieldTrace</h1><p>Please check your internet connection and reopen the app.</p></body></html>' > www/index.html
          fi
          if [ ! -d android ]; then npx cap add android; fi
          M=android/app/src/main/AndroidManifest.xml
          S=android/app/src/main/res/values/strings.xml
          grep -q ACCESS_NETWORK_STATE $M || sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.VIBRATE" />#' $M
          grep -q capacitor_background_geolocation_notification_channel_name $S || sed -i 's#</resources>#    <string name="capacitor_background_geolocation_notification_channel_name">FieldTrace location sharing</string>\n</resources>#' $S
          npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: FieldTrace-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
